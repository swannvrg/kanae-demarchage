<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--a:#1f4e5f;--bg:#f8f5f0;--card:#fff;--ink:#231a1e;--mut:#6f6468;--line:#e4dcd3;--soft:#f1e9df}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--a);color:#fff;padding:14px 18px}header h1{margin:0;font:600 19px Georgia,serif;letter-spacing:.3px}

.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 18px;background:var(--soft);border-bottom:1px solid var(--line);align-items:center}

.it{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.it.on{border-color:var(--a);border-left-color:var(--a);box-shadow:0 1px 4px #0002}.it.win{border-left-color:#2e8b57}.it.done{opacity:.6}
.it .n{font-weight:600}.it .s{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--soft);color:var(--mut);white-space:nowrap}
.tag.p1{background:var(--a);color:#fff}
#det{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px;margin:10px 0}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}.v{word-break:break-word}
a{color:var(--a)}
.warn{background:#fff4d6;border:1px solid #e9cf8a;border-radius:6px;padding:7px 10px;font-size:13px;margin:8px 0}
.script{background:var(--soft);border-left:4px solid var(--a);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:15px}

#toast.s{opacity:1}
@media(max-width:760px){main{grid-template-columns:1fr}#list{max-height:none}}
@media print{.bar,#list,button{display:none}main{display:block}}

 for(const k of["statut","date","next","nextDate","notes"])$("#e_"+k).onchange=e=>upd(k,e.target.value);

 $("#cp").onclick=()=>{const t=d["Accroche premier contact"];(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Accroche copiée"),()=>{const r=document.createRange();r.selectNode($("#scr"));getSelection().removeAllRanges();getSelection().addRange(r);toast("Texte sélectionné : Ctrl+C")})};
}
$("#list").onclick=e=>{const b=e.target.closest(".it");if(b){cur=b.dataset.id;renderList();renderDet()}};
for(const i of["q","fs","fp"])$("#"+i).oninput=renderList;
const QL=CFG.questions.map(q=>q[0]), HEAD=["ID","Organisation","Ville","Téléphone","Statut","Dernier contact","Prochaine action","Date de relance",...QL,"Notes","Historique","Suivi par","_maj"];
const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
$("#exp").onclick=()=>{const lines=[HEAD.map(cell).join(";")];
 DATA.forEach(d=>{const s=st(d.ID);lines.push([d.ID,d.Organisation,d.Ville,d["Téléphone"],s.statut,s.date,s.next,s.nextDate,...QL.map(q=>s.q[q]||""),s.notes,s.hist.join(" | "),s.par,s.maj].map(cell).join(";"))});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"}));a.download=CFG.key+"_suivi_"+new Date().toISOString().slice(0,10)+".csv";a.click();toast("Suivi exporté")};
function parseCSV(t){const R=[];let r=[],c="",q=false;t=t.replace(/^﻿/,"");for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch==='"')q=true;else if(ch===";"){r.push(c);c=""}else if(ch==="\n"){r.push(c);R.push(r);r=[];c=""}else if(ch!=="\r")c+=ch}
 if(c||r.length){r.push(c);R.push(r)}return R}
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{
 const R=parseCSV(rd.result),H=R[0]||[],g=(row,k)=>row[H.indexOf(k)]||"";if(!H.includes("_maj")||!H.includes("ID")){toast("Ce fichier n'est pas un export de cet outil");return}
 let n=0;R.slice(1).forEach(row=>{const id=g(row,"ID"),maj=+g(row,"_maj");if(!DATA.some(d=>d.ID===id)||!maj)return;const s=st(id);if(maj<=s.maj)return;
  S[id]={statut:g(row,"Statut")||CFG.statuts[0],date:g(row,"Dernier contact"),next:g(row,"Prochaine action"),nextDate:g(row,"Date de relance"),notes:g(row,"Notes"),par:g(row,"Suivi par"),hist:g(row,"Historique")?g(row,"Historique").split(" | "):[],q:Object.fromEntries(QL.map(q=>[q,g(row,q)]).filter(x=>x[1])),maj};n++});
 save();renderList();if(cur)renderDet();toast(n+" fiche(s) mise(s) à jour");e.target.value=""};rd.readAsText(f,"utf-8")};
renderList();
</script></body></html>
